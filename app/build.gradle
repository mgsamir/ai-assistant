plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.assistant'
    compileSdk 34

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "com.example.assistant"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "GEMINI_API_KEY", "\"${System.getenv('GEMINI_API_KEY') ?: ''}\""
        buildConfigField "String", "BRAVE_KEY", "\"${System.getenv('BRAVE_KEY') ?: ''}\""
        buildConfigField "String", "GROQ_KEY", "\"${System.getenv('GROQ_KEY') ?: ''}\""
        buildConfigField "String", "OPENROUTER_KEY", "\"${System.getenv('OPENROUTER_KEY') ?: ''}\""
        buildConfigField "String", "ELEVEN_KEY", "\"${System.getenv('ELEVEN_KEY') ?: ''}\""
        buildConfigField "String", "OPENAI_KEY", "\"\""
        buildConfigField "String", "VT_KEY", "\"${System.getenv('VT_KEY') ?: ''}\""
        buildConfigField "String", "POLLI_KEY", "\"${System.getenv('POLLI_KEY') ?: ''}\""
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    packaging { resources { excludes += ['META-INF/*', 'META-INF/**'] } }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.smali:baksmali:2.5.2'
}
