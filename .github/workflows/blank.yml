name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Restore signing key
        run: base64 -d app/debug.keystore.b64 > app/debug.keystore
      - name: Check Gemini key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY secret khaali hai, app mein key haath se daalni padegi"
          else
            echo "Gemini key mil gayi"
          fi
      - name: Check extra keys
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRAVE_KEY: ${{ secrets.BRAVE_API_KEY || secrets.BRAVE_API_KEY_1 || secrets.BRAVE_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER }}
          ELEVEN_KEY: ${{ secrets.ELEVENLABS_API_KEY || secrets.ELEVENLABS_KEY || secrets.ELEVENLABS }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_API_KEY_1 || secrets.OPENAI_KEY }}
          VT_KEY: ${{ secrets.VIRUSTOTAL_API_KEY || secrets.VIRUSTOTAL_KEY || secrets.VT_API_KEY }}
        run: |
          for n in BRAVE_KEY GROQ_KEY OPENROUTER_KEY ELEVEN_KEY OPENAI_KEY VT_KEY; do
            if [ -z "${!n}" ]; then echo "::warning::$n khaali hai"; else echo "$n mil gayi"; fi
          done
      - run: gradle assembleDebug --no-daemon
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRAVE_KEY: ${{ secrets.BRAVE_API_KEY || secrets.BRAVE_API_KEY_1 || secrets.BRAVE_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER }}
          ELEVEN_KEY: ${{ secrets.ELEVENLABS_API_KEY || secrets.ELEVENLABS_KEY || secrets.ELEVENLABS }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_API_KEY_1 || secrets.OPENAI_KEY }}
          VT_KEY: ${{ secrets.VIRUSTOTAL_API_KEY || secrets.VIRUSTOTAL_KEY || secrets.VT_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: my-assistant-apk
          path: app/build/outputs/apk/debug/app-debug.apk
